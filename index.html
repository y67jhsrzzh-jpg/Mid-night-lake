<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Lake</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 水聲音檔 (請確保未來上傳檔案至 assets/water.mp3) -->
    <audio id="ambientWater" src="assets/water.mp3" loop></audio>
    
    <!-- 水波紋畫布 -->
    <canvas id="lakeCanvas"></canvas>
    
    <!-- 初始提示字 -->
    <div id="intro-text">Touch the surface</div>
    
    <!-- 主要內容區 (初始為隱藏淡出狀態) -->
    <div id="content">
        <h1>Midnight Lake</h1>
        <p class="subtitle">獨立音樂與節拍檢索庫</p>
        
        <div class="genre-container">
            <div class="genre" id="genre-shoegaze">
                <h2>Shoegaze</h2>
                <ul class="band-list"></ul>
            </div>
            <div class="genre" id="genre-hiphop">
                <h2>Hip-hop</h2>
                <ul class="band-list"></ul>
            </div>
            <div class="genre" id="genre-indie">
                <h2>Indie</h2>
                <ul class="band-list"></ul>
            </div>
            <div class="genre" id="genre-janglepop">
                <h2>Jangle Pop</h2>
                <ul class="band-list"></ul>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
