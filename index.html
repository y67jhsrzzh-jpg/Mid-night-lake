<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midnight Lake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <audio id="ambientWater" src="assets/water.mp3" loop></audio>
    <canvas id="lakeCanvas"></canvas>
    
    <div id="intro-text">Touch the surface</div>
    
    <div id="content">
        <h1>Midnight Lake</h1>
        <p class="subtitle">獨立音樂與節拍檢索庫</p>
        
        <div class="genre-container">
            <div class="genre" id="genre-shoegaze">
                <h2>Shoegaze</h2>
                <ul class="band-list"></ul>
            </div>
            <div class="genre" id="genre-hiphop">
                <h2>Hip-hop</h2>
                <ul class="band-list"></ul>
            </div>
            <div class="genre" id="genre-indie">
                <h2>Indie</h2>
                <ul class="band-list"></ul>
            </div>
            <div class="genre" id="genre-janglepop">
                <h2>Jangle Pop</h2>
                <ul class="band-list"></ul>
            </div>
        </div>

        <!-- 放在畫面最底下的裝飾字 -->
        <div class="tbc">to be continued...</div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
