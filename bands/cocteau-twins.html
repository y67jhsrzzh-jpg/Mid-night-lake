<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocteau Twins — Midnight Lake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Noto+Serif+TC:wght@200;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 樂團內頁專屬微調樣式 */
        .band-page {
            max-width: 700px; margin: 0 auto; padding: 12vh 20px;
            position: relative; z-index: 2; color: rgba(255, 255, 255, 0.8);
        }
        .back-link {
            display: inline-block; margin-bottom: 3rem;
            color: rgba(255, 255, 255, 0.4); text-decoration: none;
            font-style: italic; letter-spacing: 2px; transition: color 0.3s;
        }
        .back-link:hover { color: rgba(255, 255, 255, 0.9); }
        .band-page h1 { font-size: 3.5rem; margin-bottom: 1rem; }
        .tags { font-size: 0.9rem; letter-spacing: 3px; color: rgba(255, 255, 255, 0.4); margin-bottom: 2.5rem; font-style: italic; }
        .section-block { margin-bottom: 3rem; line-height: 1.8; font-weight: 300; }
        .section-block h3 { font-size: 1.3rem; font-style: italic; margin-bottom: 0.8rem; color: rgba(255, 255, 255, 0.9); border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.3px; }
        .track-list { list-style: none; padding-left: 0; }
        .track-list li { padding: 0.5rem 0; border-bottom: 1px dashed rgba(255,255,255,0.08); }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="band-page">
        <a href="../index.html" class="back-link">← 返回湖面</a>
        <h1>Cocteau Twins</h1>
        <div class="tags">#Ethereal Wave #Dream Pop #Shoegaze</div>
        
        <div class="section-block">
            <h3>聽感與氛圍</h3>
            <p>來自蘇格蘭的 Cocteau Twins 創造了彷彿不屬於人間的聲音景觀。 Elizabeth Fraser 那難以言喻、超越語言限制的空靈人聲，交織著重度回音與層層堆疊的吉他音牆。他們的音樂像是一場漫長而溫柔的迷霧，帶著孤寂、華麗與深邃的空間感。</p>
        </div>

        <div class="section-block">
            <h3>必聽推薦曲目</h3>
            <ul class="track-list">
                <li>Heaven or Las Vegas</li>
                <li>Cherry-coloured Funk</li>
                <li>Sea, Swallow Me</li>
            </ul>
        </div>
    </div>
</body>
</html>
